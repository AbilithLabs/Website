<svg viewBox="0 0 760 448" role="img" aria-label="Weight sits at the shoulder, so the hand carries only thin brakes and sensors" font-family="Archivo, Helvetica Neue, Arial, sans-serif" font-size="12"><defs><marker id="hermes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a59d92"></path></marker><marker id="hermes-hot-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d99a62"></path></marker></defs><rect width="760" height="448" fill="#0b0a09"></rect><text x="24" y="70" font-family="Archivo, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" font-stretch="condensed" fill="#ece5d9">WEIGHT SITS AT THE SHOULDER, SO THE HAND</text><text x="24" y="94" font-family="Archivo, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" font-stretch="condensed" fill="#ece5d9">CARRIES ONLY THIN BRAKES AND SENSORS</text><g><rect x="24.5" y="26.5" width="7" height="7" fill="none" stroke="#a59d92"></rect><text x="42" y="34" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#a59d92">FIG. 3 · HERMES V1 LAYOUT</text></g><g><rect x="24" y="116" width="712" height="56" fill="#12100e" stroke="rgba(236,229,217,0.2)"></rect><text x="40" y="139" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.1" fill="#ece5d9">GLASSES AND PHONE</text><text x="40" y="158" fill="#a59d92">Run vision and skill models, send short targets to the sleeve</text></g><g><path d="M612 174V206" fill="none" stroke="#a59d92" marker-start="url(#hermes-arrow)" marker-end="url(#hermes-arrow)"></path><text x="624" y="194" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.1" fill="#a59d92">BLUETOOTH</text></g><g><rect x="24" y="208" width="712" height="188" fill="none" stroke="rgba(236,229,217,0.2)" stroke-dasharray="3 4"></rect><text x="40" y="231" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.1" fill="#a59d92">KNIT SLEEVE: WIRING, ELECTRODES AND 12 VIBRATION MOTORS</text></g><g><rect x="40" y="244" width="216" height="136" fill="#12100e" stroke="rgba(236,229,217,0.2)" stroke-width="1"></rect><text x="54" y="270" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.1" fill="#ece5d9">HAND AND FINGERS</text><text x="54" y="294" fill="#ece5d9">5 electrostatic finger brakes</text><text x="54" y="311" fill="#ece5d9">Strain-sensor glove</text><text x="54" y="328" fill="#ece5d9">Carbon back-of-hand plate</text><text x="54" y="345" fill="#ece5d9">Hand IMU</text><text x="54" y="366" fill="#a59d92">Brakes release with no power</text></g><g><rect x="272" y="244" width="216" height="136" fill="#12100e" stroke="rgba(236,229,217,0.2)" stroke-width="1"></rect><text x="286" y="270" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.1" fill="#ece5d9">WRIST AND FOREARM</text><text x="286" y="294" fill="#ece5d9">Wrist brakes and driver</text><text x="286" y="311" fill="#ece5d9">Grip-assist cable to the hand</text><text x="286" y="328" fill="#ece5d9">16-channel dry EMG band</text><text x="286" y="345" fill="#ece5d9">Carbon cuff and IMU</text><text x="286" y="366" fill="#a59d92">Wrist chip runs the fast loop</text></g><g><rect x="504" y="244" width="216" height="136" fill="#12100e" stroke="#d99a62" stroke-width="1.5"></rect><text x="518" y="270" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.1" fill="#d99a62">UPPER ARM AND SHOULDER</text><text x="518" y="294" fill="#ece5d9">8 Wh battery, about 36 g</text><text x="518" y="311" fill="#ece5d9">Shoulder chip and radio</text><text x="518" y="328" fill="#ece5d9">Carbon upper-arm cuff</text><text x="518" y="345" fill="#ece5d9">Grip-assist motor and 2 IMUs</text><text x="518" y="366" fill="#a59d92">Later: EMS stimulator</text></g><text x="24" y="424" fill="#a59d92">Estimated total about 400 to 550 g, with about 90 to 130 g past the wrist</text></svg>
