<svg viewBox="0 0 760 332" role="img" aria-label="The same AI can make robots more capable, or people" font-family="Archivo, Helvetica Neue, Arial, sans-serif" font-size="12"><defs><marker id="fut-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a59d92"></path></marker><marker id="fut-hot-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d99a62"></path></marker></defs><rect width="760" height="332" fill="#0b0a09"></rect><text x="24" y="70" font-family="Archivo, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" font-stretch="condensed" fill="#ece5d9">THE SAME AI CAN MAKE ROBOTS MORE CAPABLE, OR PEOPLE</text><g><rect x="24.5" y="26.5" width="7" height="7" fill="none" stroke="#a59d92"></rect><text x="42" y="34" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#a59d92">FIG. 1 · TWO FUTURES OF PHYSICAL AI</text></g><text x="24" y="112" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.1" fill="#a59d92">FUTURE 1 · ROBOTS DO IT FOR US (THE WALL-E PATH)</text><g><path d="M184 156H207" fill="none" stroke="#a59d92" marker-end="url(#fut-arrow)"></path><path d="M368 156H391" fill="none" stroke="#a59d92" marker-end="url(#fut-arrow)"></path><path d="M552 156H575" fill="none" stroke="#a59d92" marker-end="url(#fut-arrow)"></path></g><g><rect x="24" y="124" width="160" height="64" fill="#12100e" stroke="rgba(236,229,217,0.2)" stroke-width="1" stroke-dasharray="none"></rect><text x="38" y="151" font-size="13" fill="#a59d92">A robot learns</text><text x="38" y="169" font-size="13" fill="#a59d92">the skill</text></g><g><rect x="208" y="124" width="160" height="64" fill="#12100e" stroke="rgba(236,229,217,0.2)" stroke-width="1" stroke-dasharray="none"></rect><text x="222" y="151" font-size="13" fill="#a59d92">The robot does</text><text x="222" y="169" font-size="13" fill="#a59d92">the work</text></g><g><rect x="392" y="124" width="160" height="64" fill="#12100e" stroke="rgba(236,229,217,0.2)" stroke-width="1" stroke-dasharray="none"></rect><text x="406" y="151" font-size="13" fill="#a59d92">People stop</text><text x="406" y="169" font-size="13" fill="#a59d92">practicing</text></g><g><rect x="576" y="124" width="160" height="64" fill="#12100e" stroke="rgba(236,229,217,0.2)" stroke-width="1" stroke-dasharray="3 4"></rect><text x="590" y="151" font-size="13" fill="#a59d92">Human ability</text><text x="590" y="169" font-size="13" fill="#a59d92">fades</text></g><text x="24" y="228" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.1" fill="#ece5d9">FUTURE 2 · AI RUNS THROUGH US (THE ABILITH PATH)</text><g><path d="M184 272H207" fill="none" stroke="#a59d92" marker-end="url(#fut-arrow)"></path><path d="M368 272H391" fill="none" stroke="#a59d92" marker-end="url(#fut-arrow)"></path><path d="M552 272H575" fill="none" stroke="#a59d92" marker-end="url(#fut-arrow)"></path></g><g><rect x="24" y="240" width="160" height="64" fill="#12100e" stroke="rgba(236,229,217,0.2)" stroke-width="1" stroke-dasharray="none"></rect><text x="38" y="267" font-size="13" fill="#ece5d9">An expert’s skill</text><text x="38" y="285" font-size="13" fill="#ece5d9">is captured</text></g><g><rect x="208" y="240" width="160" height="64" fill="#12100e" stroke="rgba(236,229,217,0.2)" stroke-width="1" stroke-dasharray="none"></rect><text x="222" y="267" font-size="13" fill="#ece5d9">AI guides your</text><text x="222" y="285" font-size="13" fill="#ece5d9">arm through it</text></g><g><rect x="392" y="240" width="160" height="64" fill="#12100e" stroke="rgba(236,229,217,0.2)" stroke-width="1" stroke-dasharray="none"></rect><text x="406" y="267" font-size="13" fill="#ece5d9">You do</text><text x="406" y="285" font-size="13" fill="#ece5d9">the work</text></g><g><rect x="576" y="240" width="160" height="64" fill="#12100e" stroke="#d99a62" stroke-width="1.5" stroke-dasharray="none"></rect><text x="590" y="267" font-size="13" font-weight="600" fill="#d99a62">Human ability</text><text x="590" y="285" font-size="13" font-weight="600" fill="#d99a62">grows</text></g></svg>
