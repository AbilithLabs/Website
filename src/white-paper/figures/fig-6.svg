<svg viewBox="0 0 760 384" role="img" aria-label="One system for every domain where skill is physical" font-family="Archivo, Helvetica Neue, Arial, sans-serif" font-size="12"><defs><marker id="sc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a59d92"></path></marker><marker id="sc-hot-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d99a62"></path></marker></defs><rect width="760" height="384" fill="#0b0a09"></rect><text x="24" y="70" font-family="Archivo, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" font-stretch="condensed" fill="#ece5d9">ONE SYSTEM FOR EVERY DOMAIN WHERE SKILL IS PHYSICAL</text><g><rect x="24.5" y="26.5" width="7" height="7" fill="none" stroke="#a59d92"></rect><text x="42" y="34" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#a59d92">FIG. 6 · BEYOND THE FIRST SKILL</text></g><g><text x="24" y="108" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.1" fill="#a59d92">WORLD</text><text x="150" y="108" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.1" fill="#a59d92">WHO IT’S FOR</text><text x="370" y="108" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" letter-spacing="1.1" fill="#a59d92">WHERE IT LEADS</text><line x1="24" x2="736" y1="120" y2="120" stroke="rgba(236,229,217,0.2)"></line></g><g><line x1="24" x2="736" y1="184" y2="184" stroke="rgba(236,229,217,0.1)"></line><line x1="24" x2="736" y1="230" y2="230" stroke="rgba(236,229,217,0.1)"></line><line x1="24" x2="736" y1="294" y2="294" stroke="rgba(236,229,217,0.1)"></line><line x1="24" x2="736" y1="358" y2="358" stroke="rgba(236,229,217,0.1)"></line></g><g><text x="24" y="147" font-family="Archivo, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" font-stretch="condensed" fill="#ece5d9">WORK</text><text x="150" y="146" font-size="12.5" fill="#a59d92">Manufacturers, trades, hospitals</text><text x="370" y="146" font-size="13" fill="#ece5d9">A new assembler up to speed in a fraction of the time;</text><text x="370" y="164" font-size="13" fill="#ece5d9">a surgical resident guided by the best surgeons alive</text></g><g><text x="24" y="212" font-family="Archivo, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" font-stretch="condensed" fill="#ece5d9">PLAY</text><text x="150" y="211" font-size="12.5" fill="#a59d92">Athletes, players, fans</text><text x="370" y="211" font-size="13" fill="#ece5d9">A champion’s serve or swing, felt in your own arm</text></g><g><text x="24" y="257" font-family="Archivo, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" font-stretch="condensed" fill="#ece5d9">LEARN</text><text x="150" y="256" font-size="12.5" fill="#a59d92">Students and hobbyists</text><text x="370" y="256" font-size="13" fill="#ece5d9">Piano, painting and knife skills, learned by feel</text><text x="370" y="274" font-size="13" fill="#ece5d9">instead of from a video</text></g><g><text x="24" y="321" font-family="Archivo, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" font-stretch="condensed" fill="#ece5d9">RESTORE</text><text x="150" y="320" font-size="12.5" fill="#a59d92">Patients and older adults</text><text x="370" y="320" font-size="13" fill="#ece5d9">Recovery guided by the movement of</text><text x="370" y="338" font-size="13" fill="#ece5d9">the world’s best therapists</text></g></svg>
