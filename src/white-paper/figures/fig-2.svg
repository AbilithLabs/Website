<svg viewBox="0 0 760 348" role="img" aria-label="The human leads every turn of the loop" font-family="Archivo, Helvetica Neue, Arial, sans-serif" font-size="12"><defs><marker id="loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a59d92"></path></marker><marker id="loop-hot-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d99a62"></path></marker></defs><rect width="760" height="348" fill="#0b0a09"></rect><text x="24" y="70" font-family="Archivo, Arial Narrow, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="700" font-stretch="condensed" fill="#ece5d9">THE HUMAN LEADS EVERY TURN OF THE LOOP</text><g><rect x="24.5" y="26.5" width="7" height="7" fill="none" stroke="#a59d92"></rect><text x="42" y="34" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#a59d92">FIG. 2 · THE SOMATIC LOOP</text></g><g fill="none" stroke-width="1"><path d="M184 232H207" stroke="#a59d92" marker-end="url(#loop-arrow)"></path><path d="M368 232H391" stroke="#a59d92" marker-end="url(#loop-arrow)"></path><path d="M552 232H575" stroke="#a59d92" marker-end="url(#loop-arrow)"></path><path d="M288 148V178" stroke="#a59d92" stroke-dasharray="3 4" marker-end="url(#loop-arrow)"></path><path d="M656 284V316H104V287" stroke="#d99a62" marker-end="url(#loop-hot-arrow)"></path></g><text x="380" y="307" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.1" fill="#a59d92">EACH TURN BRINGS THE NEXT MOVEMENT CLOSER TO THE SKILL</text><g><rect x="188" y="92" width="200" height="56" fill="#12100e" stroke="rgba(236,229,217,0.2)"></rect><text x="204" y="115" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.1" fill="#ece5d9">SKILL LIBRARY</text><text x="204" y="135" fill="#a59d92">Recorded from experts</text></g><g><rect x="24" y="180" width="160" height="104" fill="#12100e" stroke="rgba(236,229,217,0.2)" stroke-width="1"></rect><text x="38" y="206" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.1" fill="#ece5d9">SENSE</text><text x="38" y="229" fill="#a59d92">Sleeve reads joints</text><text x="38" y="246" fill="#a59d92">and muscles; glasses</text><text x="38" y="263" fill="#a59d92">see the task</text></g><g><rect x="208" y="180" width="160" height="104" fill="#12100e" stroke="rgba(236,229,217,0.2)" stroke-width="1"></rect><text x="222" y="206" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.1" fill="#ece5d9">COMPARE</text><text x="222" y="229" fill="#a59d92">Somatic intelligence</text><text x="222" y="246" fill="#a59d92">matches you to the</text><text x="222" y="263" fill="#a59d92">expert, fitted to you</text></g><g><rect x="392" y="180" width="160" height="104" fill="#12100e" stroke="rgba(236,229,217,0.2)" stroke-width="1"></rect><text x="406" y="206" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.1" fill="#ece5d9">GUIDE</text><text x="406" y="229" fill="#a59d92">Cues, brakes and</text><text x="406" y="246" fill="#a59d92">light grip assist</text><text x="406" y="263" fill="#a59d92">from hand to shoulder</text></g><g><rect x="576" y="180" width="160" height="104" fill="#12100e" stroke="#d99a62" stroke-width="1.5"></rect><text x="590" y="206" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.1" fill="#d99a62">YOU LEAD</text><text x="590" y="229" fill="#ece5d9">Redirect or stop it</text><text x="590" y="246" fill="#ece5d9">anytime; help steps</text><text x="590" y="263" fill="#ece5d9">back as you improve</text></g></svg>
